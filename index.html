<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eje Austral · Directorio UACh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --uach-blue: #003366; }
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    .bg-uach { background-color: var(--uach-blue); }
    .card-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
  </style>
</head>
<body class="pb-20">

  <header class="bg-uach text-white p-8 shadow-xl rounded-b-[2.5rem] mb-6">
    <div class="max-w-md mx-auto text-center">
      <h1 class="text-2xl font-black tracking-tight uppercase">EJE AUSTRAL</h1>
      <p class="text-[10px] opacity-70 mt-1 tracking-widest font-bold">RED TÉCNICA · TITULADOS UACh</p>
    </div>
  </header>

  <main id="directory" class="max-w-md mx-auto px-4 space-y-4">
    <div class="text-center py-20 text-slate-400">
      <div class="animate-spin h-8 w-8 border-4 border-blue-900 border-t-transparent rounded-full mx-auto mb-4"></div>
      <p class="text-sm">Sincronizando datos de obra...</p>
    </div>
  </main>

<script src="data.js?v=1.1"></script>

  <script>
    async function loadData() {
      const container = document.getElementById('directory');
      try {
        const records = await obtenerProveedores();
        // Usar registros de Airtable o los locales definidos en data.js
        const finalData = (records && records.length > 0) ? records : (window.DATOS_LOCALES || []);
        
        if (finalData.length === 0) {
          container.innerHTML = '<p class="text-center py-10">No hay registros cargados.</p>';
          return;
        }

        container.innerHTML = finalData.map(r => {
          // LA MAGIA: Esto detecta automáticamente dónde están los datos
          const d = r.fields ? r.fields : r;
          
          return `
            <div class="bg-white p-5 rounded-3xl card-shadow border border-white">
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-[9px] font-bold bg-blue-50 text-blue-700 px-2 py-1 rounded-md uppercase tracking-tighter">
                    ${d.Especialidad || 'General'}
                  </span>
                  <h3 class="text-lg font-bold text-slate-800 mt-1">${d.Nombre || 'Sin Nombre'}</h3>
                </div>
                ${d.Telefono ? `
                  <a href="https://wa.me/${String(d.Telefono).replace(/\D/g,'')}" class="bg-green-500 text-white p-3 rounded-2xl shadow-lg shadow-green-100">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.72.94 3.675 1.439 5.662 1.439h.056c6.552 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                  </a>
                ` : ''}
              </div>
              <p class="text-slate-600 text-xs mt-3 leading-relaxed">
                ${d.Comentario || 'Sin reseña técnica disponible.'}
              </p>
              <div class="mt-4 pt-3 border-t border-slate-50 flex justify-between items-center text-[9px] text-slate-400 font-bold uppercase tracking-tighter">
                <span>Aporte de: <span class="text-blue-900">${d.Colega || 'Red Inicial'}</span></span>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        container.innerHTML = '<p class="text-center py-10 text-red-500 font-bold">Error de conexión.</p>';
      }
    }
    loadData();
  </script>

</body>
</html>
