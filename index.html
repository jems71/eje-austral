<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eje Austral · Directorio UACh</title>

  <!-- Estilos y Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root { --uach-blue: #003366; --uach-gold: #D4AF37; }
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; }
    .bg-uach { background-color: var(--uach-blue); }
    .card-shadow { box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.1); }
    .btn-uach { background-color: var(--uach-blue); transition: all 0.2s; }
    .btn-uach:active { transform: scale(0.95); }
  </style>
</head>
<body class="pb-24">

  <!-- Encabezado Institucional -->
  <header class="bg-uach text-white p-8 shadow-2xl rounded-b-[3rem] mb-8">
    <div class="max-w-md mx-auto text-center">
      <h1 class="text-3xl font-extrabold tracking-tight">EJE AUSTRAL</h1>
      <p class="text-xs opacity-80 mt-2 uppercase tracking-[0.2em] font-semibold">Red de Titulados Miraflores · UACh</p>
    </div>
  </header>

  <!-- Buscador -->
  <div class="max-w-md mx-auto px-4 mb-8">
    <div class="relative group">
      <input type="text" id="searchInput" onkeyup="filterList()" placeholder="Buscar especialidad o nombre..."
             class="w-full p-4 pl-12 rounded-2xl border-none shadow-lg focus:ring-2 focus:ring-blue-600 text-sm transition-all">
      <span class="absolute left-4 top-4 text-gray-400">🔍</span>
    </div>
  </div>

  <!-- Lista de Contactos -->
  <main id="directory" class="max-w-md mx-auto px-4 space-y-4">
    <div class="flex flex-col items-center justify-center py-20 text-gray-400">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-900 mb-4"></div>
      <p class="text-sm font-medium">Cargando base de datos técnica...</p>
    </div>
  </main>

  <!-- Botón de Acción Flotante -->
  <button onclick="openModal()" class="fixed bottom-8 right-8 bg-orange-500 text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center text-4xl font-light hover:rotate-90 transition-all z-40">
    +
  </button>

  <!-- Modal de Registro -->
  <div id="modal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl overflow-y-auto max-h-[90vh]">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-uach">Nuevo Aporte</h2>
        <button onclick="closeModal()" class="text-gray-300 text-3xl hover:text-gray-500 transition-colors">&times;</button>
      </div>

      <form id="addForm" class="space-y-5">
        <div>
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider ml-1">Nombre Proveedor / Empresa</label>
          <input type="text" id="formNombre" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl mt-1 focus:outline-none focus:ring-2 focus:ring-blue-100" required>
        </div>

        <div>
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider ml-1">Partida o Especialidad</label>
          <select id="formEsp" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl mt-1 appearance-none">
            <option>Obra Gruesa</option>
            <option>Terminaciones</option>
            <option>Instalaciones</option>
            <option>Servicios Técnicos</option>
            <option>Colegas</option>
          </select>
        </div>

        <div>
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider ml-1">Teléfono (WhatsApp)</label>
          <input type="tel" id="formTel" placeholder="+569" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl mt-1 focus:outline-none focus:ring-2 focus:ring-blue-100">
        </div>

        <div>
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider ml-1">Reseña Técnica / Comentario</label>
          <textarea id="formCom" rows="3" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl mt-1 focus:outline-none focus:ring-2 focus:ring-blue-100"></textarea>
        </div>

        <div class="bg-blue-50/50 p-5 rounded-[1.5rem] border border-blue-100 space-y-4">
          <input type="text" id="formColega" placeholder="Tu Nombre (Firma UACh)" class="w-full p-3 bg-white border border-blue-100 rounded-xl text-sm placeholder:text-blue-200" required>
          <input type="password" id="groupPass" placeholder="Clave del grupo" class="w-full p-3 bg-white border border-blue-100 rounded-xl text-sm placeholder:text-blue-200" required>
        </div>

        <button type="submit" id="submitBtn" class="w-full py-4 btn-uach text-white rounded-2xl font-bold shadow-lg shadow-blue-900/30">
          Publicar en la Red
        </button>
      </form>
    </div>
  </div>

  <script>
    // El token y la clave viven en el servidor (variables de entorno de Vercel).
    // Este HTML solo conoce las URLs de los endpoints propios.

    let dataCache = [];

    async function loadData() {
      try {
        const res = await fetch('/api/records');
        if (!res.ok) throw new Error('Respuesta no OK');
        const data = await res.json();
        dataCache = data.records || [];
        render(dataCache);
      } catch (e) {
        document.getElementById('directory').innerHTML =
          `<p class="text-center text-red-400 p-10">Error de conexión.</p>`;
      }
    }

    function render(records) {
      const container = document.getElementById('directory');
      if (records.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-400 py-20">No hay registros aún.</p>`;
        return;
      }

      container.innerHTML = records.map(r => {
        const f = r.fields || {};
        const colorClase = f.Especialidad === "Colegas"
          ? "text-blue-600 bg-blue-50"
          : "text-slate-500 bg-slate-100";

        return `
          <div class="bg-white p-6 rounded-[2rem] card-shadow border border-white/50 transition-all active:scale-[0.98]">
            <div class="flex justify-between items-start mb-4">
              <div class="flex-1">
                <span class="px-3 py-1 ${colorClase} text-[10px] font-bold rounded-lg uppercase tracking-widest">${escapeHtml(f.Especialidad || 'GENERAL')}</span>
                <h3 class="text-xl font-bold text-slate-800 mt-2 leading-tight">${escapeHtml(f.Nombre || 'Sin nombre')}</h3>
              </div>
              ${f.telefono ? `
              <a href="https://wa.me/${String(f.telefono).replace(/\D/g,'')}" target="_blank" class="bg-green-500 text-white p-4 rounded-2xl shadow-lg shadow-green-100">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
              </a>` : ''}
            </div>
            <p class="text-slate-600 text-sm leading-relaxed mb-4">${escapeHtml(f.Comentario || 'Proveedor validado por la red.')}</p>
            <div class="pt-4 border-t border-gray-50 flex items-center justify-between">
              <span class="text-[10px] text-gray-400 uppercase font-medium tracking-tighter">Recomendado por: <span class="text-blue-800 font-bold">${escapeHtml(f.Colega || 'Red Inicial')}</span></span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Sanitiza strings antes de meterlos al DOM, evita inyecciones desde Airtable
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function filterList() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      render(dataCache.filter(r =>
        ((r.fields && r.fields.Nombre) || "").toLowerCase().includes(q) ||
        ((r.fields && r.fields.Especialidad) || "").toLowerCase().includes(q)
      ));
    }

    function openModal() { document.getElementById('modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    document.getElementById('addForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Sincronizando...";

      const payload = {
        clave: document.getElementById('groupPass').value,
        nombre: document.getElementById('formNombre').value,
        especialidad: document.getElementById('formEsp').value,
        telefono: document.getElementById('formTel').value,
        comentario: document.getElementById('formCom').value,
        colega: document.getElementById('formColega').value
      };

      try {
        const r = await fetch('/api/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (r.status === 403) {
          alert('Clave de grupo incorrecta.');
        } else if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          alert('Error al publicar: ' + (err.error || 'desconocido'));
        } else {
          closeModal();
          loadData();
          e.target.reset();
        }
      } catch (err) {
        alert('Error de red.');
      } finally {
        btn.disabled = false;
        btn.innerText = "Publicar en la Red";
      }
    };

    loadData();
  </script>
</body>
</html>
